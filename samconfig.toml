# Defaults for `sam deploy`. Region comes from your AWS CLI profile unless you pass --region.
version = 0.1

[default.global.parameters]
stack_name = "bookinapp"
region = "eu-north-1"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
s3_prefix = "bookinapp"
region = "eu-north-1"
parameter_overrides = "PaymentFailureRate=\"0\" NotificationEmail=\"\""
image_repositories = []
