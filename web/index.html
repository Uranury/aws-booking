<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Booking</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    .seats { display: grid; grid-template-columns: repeat(8, 2.75rem); gap: .4rem; margin: 1rem 0; }
    .seats button { padding: .5rem 0; }
    .seat-AVAILABLE { background: #d7f5dd; }
    .seat-RESERVED  { background: #fde9b6; }
    .seat-BOOKED    { background: #e3e3e3; }
    .seats button.selected { outline: 3px solid #2563eb; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1><a href="#/">Event Booking</a></h1>
  <main id="app">Loading…</main>
  <script src="app.js"></script>
</body>
</html>
