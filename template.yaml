AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  bookinapp - small event ticket booking system.
  S3 + CloudFront frontend, DynamoDB single-table storage, and Go Lambdas
  behind an HTTP API.

Parameters:
  PaymentFailureRate:
    Type: String
    Default: "0.2"
    AllowedPattern: "^(0(\\.\\d+)?|1(\\.0+)?)$"
    Description: Probability (0.0 - 1.0) that the mock payment step declines a booking.
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address to subscribe to booking notifications. Leave empty to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Handler: bootstrap
    MemorySize: 128
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref AppTable

Resources:
  # ---------------------------------------------------------------------------
  # Storage: one DynamoDB table (single-table design)
  #
  #   PK              SK                            what
  #   EVENT#<id>      META                          event details
  #   EVENT#<id>      SEAT#<nnn>                    one seat, status AVAILABLE|RESERVED|BOOKED
  #   USER#<id>       BOOKING#<timestamp>#<id>      one booking, newest last
  #
  # GSI1 is sparse and overloaded. Only items that set GSI1PK/GSI1SK appear in it:
  #   GSI1PK=EVENTS          GSI1SK=<startsAt>#<id>   -> list events by date (no Scan)
  #   GSI1PK=BOOKING#<id>    GSI1SK=BOOKING           -> fetch a booking by id (polling)
  # ---------------------------------------------------------------------------
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Loads sample events. Not exposed through the API; invoke with `make seed`.
  SeedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Timeout: 30
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AppTable

  # ---------------------------------------------------------------------------
  # API: HTTP API in front of Go Lambdas. Routes carry the /api prefix because
  # CloudFront forwards /api/* to this API unchanged (same origin, so no CORS).
  # ---------------------------------------------------------------------------
  BookingApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Method: GET
            Path: /api/events

  GetEventFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Method: GET
            Path: /api/events/{id}

  # Runs the whole booking flow: validate, reserve seat, pay, confirm (or
  # release the seat and mark the booking FAILED). See internal/booking.
  CreateBookingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Timeout: 15
      Environment:
        Variables:
          PAYMENT_FAILURE_RATE: !Ref PaymentFailureRate
          TOPIC_ARN: !Ref BookingTopic
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppTable
        - DynamoDBWritePolicy:
            TableName: !Ref AppTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt BookingTopic.TopicName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Method: POST
            Path: /api/bookings

  GetBookingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Method: GET
            Path: /api/bookings/{id}

  # "Booking confirmed" notifications. Subscribe an email via the
  # NotificationEmail parameter, or watch the publish in the Lambda logs.
  BookingTopic:
    Type: AWS::SNS::Topic

  BookingTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref BookingTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ---------------------------------------------------------------------------
  # Frontend: private S3 bucket, served only through CloudFront using Origin
  # Access Control. CloudFront also forwards /api/* to the HTTP API, so the
  # browser sees a single origin and no CORS configuration is needed.
  # ---------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          # Only this CloudFront distribution may read objects.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${BookingApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

Outputs:
  CloudFrontUrl:
    Description: Open this in a browser
    Value: !Sub "https://${Distribution.DomainName}"
  WebBucketName:
    Description: Bucket holding the frontend files (`make deploy-web` uploads to it)
    Value: !Ref WebBucket
  DistributionId:
    Description: CloudFront distribution id (used for cache invalidation)
    Value: !Ref Distribution
  TableName:
    Description: DynamoDB table holding events, seats and bookings
    Value: !Ref AppTable
  ApiUrl:
    Description: HTTP API base URL (the frontend reaches it through CloudFront at /api)
    Value: !Sub "https://${BookingApi}.execute-api.${AWS::Region}.amazonaws.com"
  SeedFunctionName:
    Description: Invoke once after deploy to load sample events
    Value: !Ref SeedFunction
